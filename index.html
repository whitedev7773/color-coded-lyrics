<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Lyrics</title>
    <link rel="stylesheet" href="./src/assets/fonts/a2z/a2z.css" />
    <link rel="stylesheet" href="./src/styles/index.css" />
    <link rel="stylesheet" href="./src/styles/spectrum.css" />
    <link rel="stylesheet" href="./src/styles/context-menu.css" />
    <script src="./src/scripts/index.ts" type="module" defer></script>
  </head>
  <body>
    <img id="bgImg" alt="" />
    <div id="bgOverlay"></div>
    <input type="file" id="bgInput" accept="image/*" style="display: none" />
    <input type="file" id="musicInput" accept="audio/*" style="display: none" />
    <audio id="musicPlayer" preload="metadata"></audio>

    <dialog id="lyricsDialog">
      <h2>가사 입력</h2>
      <p class="hint">
        <code>lyrics.txt</code> 내용을 여기에 붙여 넣어 주세요.<br />
        형식은
        <code>[파트 - 1] #"아티스트" 가사 한 줄</code>
        <code>[파트 - 2] #"A+B" 가사 한 줄</code>
        형태를 사용하면 됩니다.
      </p>
      <textarea
        id="lyricsTextarea"
        placeholder='[Verse - 1] #"Eve" 첫 줄 가사&#10;로마자 가사&#10;번역 가사'
      ></textarea>
      <div class="dialog-actions">
        <button
          class="btn-secondary"
          type="button"
          onclick="document.getElementById('lyricsDialog').close()"
        >
          닫기
        </button>
        <button class="btn-primary" id="applyLyricsBtn" type="button">
          적용
        </button>
      </div>
    </dialog>

    <section id="artistSection">
      <div id="artistsPanel"></div>
    </section>

    <div id="divider"></div>

    <section id="lyricsSection">
      <div id="partLabel"></div>
      <div id="lyricsArea">
        <div id="lyricJp">&nbsp;</div>
        <div id="lyricRoma">&nbsp;</div>
        <div id="lyricKo">&nbsp;</div>
      </div>
    </section>

    <div id="spectrumBar" aria-hidden="true">
      <canvas id="spectrumCanvas"></canvas>
    </div>

    <nav id="contextMenu" class="context-menu" hidden aria-label="Context menu">
      <button type="button" class="context-menu-item" data-action="edit-lyrics">
        가사 수정
      </button>
      <button
        type="button"
        class="context-menu-item"
        data-action="change-background"
      >
        배경 변경
      </button>
      <button
        type="button"
        class="context-menu-item"
        data-action="change-music"
      >
        음악 변경
      </button>
      <button
        type="button"
        class="context-menu-item"
        data-action="toggle-playback"
      >
        재생 / 일시정지
      </button>
      <button
        type="button"
        class="context-menu-item"
        data-action="previous-lyric"
      >
        이전 가사
      </button>
      <button type="button" class="context-menu-item" data-action="next-lyric">
        다음 가사
      </button>
      <button
        type="button"
        id="contextMenuSettingsToggle"
        class="context-menu-item context-menu-item-accent"
        data-action="toggle-settings"
        aria-haspopup="dialog"
        aria-controls="settingsPanel"
      >
        상세 조정
      </button>
    </nav>

    <div id="settingsBackdrop" class="settings-backdrop" hidden></div>
    <aside
      id="settingsPanel"
      class="settings-panel"
      hidden
      aria-label="상세 조정 패널"
    >
      <div class="settings-panel-header">
        <div>
          <p class="settings-panel-eyebrow">상세 조정</p>
          <h2 class="settings-panel-title">재생 화면 세부 설정</h2>
        </div>
        <button
          id="settingsPanelClose"
          type="button"
          class="settings-panel-close"
          aria-label="상세 조정 닫기"
        >
          닫기
        </button>
      </div>

      <section class="context-menu-group">
        <p class="context-menu-group-title">스펙트럼 설정</p>
        <label class="context-menu-control">
          <span>바 개수</span>
          <div class="context-menu-field">
            <input
              id="barCountInput"
              type="range"
              min="24"
              max="320"
              step="8"
            />
            <output id="barCountValue" for="barCountInput"></output>
          </div>
        </label>
        <label class="context-menu-control">
          <span>최대 높이</span>
          <div class="context-menu-field">
            <input
              id="barHeightInput"
              type="range"
              min="80"
              max="360"
              step="10"
            />
            <output id="barHeightValue" for="barHeightInput"></output>
          </div>
        </label>
        <label class="context-menu-control">
          <span>스무딩</span>
          <div class="context-menu-field">
            <input
              id="smoothingInput"
              type="range"
              min="0.1"
              max="0.98"
              step="0.01"
            />
            <output id="smoothingValue" for="smoothingInput"></output>
          </div>
        </label>
        <label class="context-menu-control">
          <span>FFT 크기</span>
          <div class="context-menu-field">
            <select id="fftSizeInput">
              <option value="32">32</option>
              <option value="64">64</option>
              <option value="128">128</option>
              <option value="256">256</option>
              <option value="512">512</option>
              <option value="1024">1024</option>
              <option value="2048">2048</option>
            </select>
            <output id="fftSizeValue" for="fftSizeInput"></output>
          </div>
        </label>
        <label class="context-menu-control">
          <span>최소 주파수</span>
          <div class="context-menu-field">
            <input
              id="minFrequencyInput"
              type="range"
              min="20"
              max="18000"
              step="20"
            />
            <output id="minFrequencyValue" for="minFrequencyInput"></output>
          </div>
        </label>
        <label class="context-menu-control">
          <span>최대 주파수</span>
          <div class="context-menu-field">
            <input
              id="maxFrequencyInput"
              type="range"
              min="100"
              max="20000"
              step="50"
            />
            <output id="maxFrequencyValue" for="maxFrequencyInput"></output>
          </div>
        </label>
      </section>

      <section class="context-menu-group">
        <p class="context-menu-group-title">애니메이션 시간</p>
        <label class="context-menu-control">
          <span>가사 사라짐</span>
          <div class="context-menu-field">
            <input
              id="lyricFadeOutInput"
              type="range"
              min="50"
              max="1000"
              step="10"
            />
            <output id="lyricFadeOutValue" for="lyricFadeOutInput"></output>
          </div>
        </label>
        <label class="context-menu-control">
          <span>가사 등장</span>
          <div class="context-menu-field">
            <input
              id="lyricFadeInInput"
              type="range"
              min="50"
              max="1200"
              step="10"
            />
            <output id="lyricFadeInValue" for="lyricFadeInInput"></output>
          </div>
        </label>
        <label class="context-menu-control">
          <span>파트 표시 시간</span>
          <div class="context-menu-field">
            <input
              id="partRevealInput"
              type="range"
              min="800"
              max="8000"
              step="100"
            />
            <output id="partRevealValue" for="partRevealInput"></output>
          </div>
        </label>
      </section>

      <button
        type="button"
        class="context-menu-item context-menu-item-reset"
        data-action="reset-settings"
      >
        설정 초기화
      </button>
    </aside>
  </body>
</html>
